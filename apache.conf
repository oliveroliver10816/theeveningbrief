# Apache rules for Heroku (heroku-php-apache2 -C apache.conf).
#
# This is a duplicate of .htaccess, and it exists for one reason: some upload
# paths silently drop dot-files, so .htaccess never arrives and every pretty URL
# 404s. This file is not a dot-file, so it always makes it.
#
# Same hard rule as .htaccess: NO redirects. No force-HTTPS, no force-www, no
# hardcoded domain. Heroku already terminates TLS, and a redirect here would
# make the app unviewable on its own herokuapp.com URL. The only rewrite is
# internal.

<Directory "/app">
    Options -Indexes
    DirectoryIndex index.php index.html
    AllowOverride All
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Real files and directories are served as-is.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # The database and cache are never web-readable.
        RewriteRule ^data/ - [F,L]

        # Everything else goes to the front controller. Internal only, no [R].
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

# Belt to the braces above: block data/ even if mod_rewrite is unavailable.
<Directory "/app/data">
    Require all denied
</Directory>
